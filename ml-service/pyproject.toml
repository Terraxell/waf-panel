[project]
name = "waf-ml-service"
version = "0.1.0"
description = "Online ML inference for waf-panel — FastAPI + joblib"
requires-python = ">=3.11"
authors = [{ name = "Gennadii Panteleev", email = "Terraxell@gmail.com" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "joblib>=1.4",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "redis>=5.0",
    "psycopg[binary]>=3.1",
    # waf-ml is installed from ../ml at image build time (see Dockerfile).
]

[project.optional-dependencies]
xgboost = ["xgboost>=2.1"]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.5"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]
ignore = ["E501", "UP017"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
