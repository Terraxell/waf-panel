# CRS exclusions and tuning, applied BEFORE the CRS rules run.
# WHY: DVWA intentionally sends payloads that CRS would correctly flag during
#      benign navigation (the login page itself echoes <script> tags etc.).
#      Without these exclusions the demo gets noisy false positives that
#      drown the genuine attack signals we want to measure.

# 1. The DVWA setup page must remain reachable to install the schema; we lift
#    the standard rules only on this exact path. SAFETY: never widen this scope.
SecRule REQUEST_URI "@beginsWith /setup.php" \
    "id:1000,phase:1,pass,nolog,ctl:ruleEngine=DetectionOnly"

# 2. Built-in CSRF token field looks like a stack trace to PL2 rules; allow it.
SecRule REQUEST_URI "@beginsWith /vulnerabilities/" \
    "id:1001,phase:1,pass,nolog,ctl:ruleRemoveTargetById=941100;ARGS:user_token"

# 3. DVWA "Brute Force" exercise sends repeated POSTs with `username` and
#    `password` literals; CRS 941100 sometimes flags them. We keep CRS active
#    but disable that specific rule on that specific endpoint.
SecRule REQUEST_URI "@beginsWith /vulnerabilities/brute/" \
    "id:1002,phase:1,pass,nolog,ctl:ruleRemoveById=941100"
