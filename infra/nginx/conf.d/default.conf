# nginx vhost — mounted directly under /etc/nginx/conf.d/, no envsubst.
# WHY: bypassing the template/envsubst step keeps `$variable` references
#      readable by nginx instead of being interpreted by envsubst as env
#      lookups. The trade-off: SERVER_NAME and upstream are hard-coded for
#      dev. Production deployments swap this whole file via configmap or a
#      Terraform-managed render.

# JSON access log format (http context — included from nginx.conf via conf.d/).
log_format json_combined escape=json
    '{'
        '"ts":"$time_iso8601",'
        '"remote_ip":"$remote_addr",'
        '"method":"$request_method",'
        '"path":"$uri",'
        '"query":"$args",'
        '"status":$status,'
        '"bytes":$bytes_sent,'
        '"latency_ms":$request_time,'
        '"ua":"$http_user_agent",'
        '"referer":"$http_referer"'
    '}';

server {
    listen 8080;
    server_name localhost;

    # SAFETY: ModSecurity is enabled image-wide; this is a defence-in-depth
    #         redeclaration so a bad include cannot silently disable it.
    modsecurity on;
    modsecurity_rules_file /etc/nginx/modsecurity.d/setup.conf;

    access_log /var/log/nginx_access.json json_combined;
    error_log  /var/log/nginx_error.log  warn;

    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://dvwa:80;
    }

    # Health endpoint — never blocked by ModSecurity, used by compose healthcheck.
    location = /__health {
        modsecurity off;
        access_log off;
        return 200 "ok\n";
    }
}
