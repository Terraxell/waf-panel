# Single-container deploy: nginx serves the SPA and proxies /api/ to
# uvicorn on localhost. Listens on the port Fly hands us via $PORT
# (we expose 8080 by convention; Fly maps 443 → 8080).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080 default_server;
    server_name _;
    root /usr/share/nginx/html;

    # Health endpoint mirrors the local stack so external monitors hit
    # the same path. The backend's /health is also reachable via /api/.
    location = /__health {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # SPA fallback — any unknown path returns index.html so React Router
    # handles it.
    location / {
        try_files $uri /index.html;
    }

    # Proxy + WS upgrade for the API. Same headers as the local nginx.conf.
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 7200s;
    }

    # Prometheus /metrics — same upstream, same auth posture (it's
    # public on purpose; safe because the route exposes no secrets).
    location /metrics {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }
}
