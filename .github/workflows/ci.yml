# waf-panel — continuous integration.
#
# WHY: a green CI badge is the single best proof that "tests pass on
# the host" actually means "tests pass for everyone, every commit".
# We split into independent jobs so a flaky one (e.g. xgboost wheel
# install) doesn't gate the others.

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# WHY: cancel the in-progress run for a branch when a new commit lands;
#      saves CI minutes during rapid iteration.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  backend:
    name: backend (pytest + ruff + mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: waf
          POSTGRES_PASSWORD: waf_dev_only
          POSTGRES_DB: waf_panel
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U waf -d waf_panel"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    env:
      JWT_SECRET: test-secret-test-secret-test
      WAF_ENV: development
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install -e backend[dev]
          pip install ruff
      - name: ruff
        run: ruff check backend/src backend/tests
      - name: mypy
        # WHY working-directory: pyproject.toml [tool.mypy] sets
        # files = ["src/waf_panel"] relative to the backend package, so
        # mypy must run from there to pick up the config + the right paths.
        working-directory: backend
        run: python -m mypy
      - name: pytest
        working-directory: backend
        run: PYTHONPATH=src python -m pytest -q

  ml:
    name: ml (pytest + ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install -e ml[dev]
          pip install ruff
      - name: ruff
        run: ruff check ml/src ml/tests
      - name: pytest
        working-directory: ml
        run: PYTHONPATH=src python -m pytest -q

  ml-service:
    name: ml-service (pytest + ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install -e ml-service[dev]
          # ml-service tests import waf_ml.features from the sibling repo.
          pip install -e ml
          pip install ruff
      - name: ruff
        run: ruff check ml-service/src ml-service/tests
      - name: pytest
        working-directory: ml-service
        run: PYTHONPATH=src:../ml/src python -m pytest -q

  bench:
    name: bench (pytest + ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install httpx pytest ruff
      - name: ruff
        run: ruff check bench
      - name: pytest
        run: python -m pytest -q bench/tests/

  audit:
    # WHY a separate job (not a step in each existing one): pip-audit
    # talks to the OSV / PyPI advisory database and we don't want a
    # transient network blip on those endpoints to fail the unit-test
    # job. continue-on-error keeps the check informational for now;
    # remove the flag once the dep tree has been triaged.
    name: audit (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: install pip-audit + tomli
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit tomli
      # WHY: install third-party deps directly from pyproject.toml
      # without --editable our local packages. The previous strategy
      # (`pip install -e backend[dev]` + `pip-audit --skip-editable`)
      # tripped pip-audit's strict mode -- in some pip-audit versions,
      # --skip-editable still errors on editable installs rather than
      # silently skipping them. Extracting the deps directly is clean
      # and audits exactly the supply-chain surface we ship.
      - name: install resolved third-party deps
        run: |
          python <<'EXTRACT'
          import tomli
          deps: list[str] = []
          for f in ('backend/pyproject.toml', 'ml/pyproject.toml', 'ml-service/pyproject.toml'):
              data = tomli.loads(open(f).read())
              deps.extend(data['project']['dependencies'])
          with open('/tmp/audit-deps.txt', 'w') as fh:
              fh.write('\n'.join(deps))
          EXTRACT
          pip install -r /tmp/audit-deps.txt --quiet
      - name: pip-audit
        run: pip-audit --strict

  frontend:
    name: frontend (tsc + eslint + vitest + vite build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: install
        # WHY: --include=optional so rollup pulls its Linux-musl wheels.
        #  troubleshooting #6: missing optional deps break vite
        # build on a fresh Linux runner.
        run: npm install --include=optional
      - name: typecheck
        run: npx tsc --noEmit
      - name: eslint
        run: npx eslint "src/**/*.{ts,tsx}"
      - name: vitest
        run: npm run test
      - name: vite build
        run: npm run build

  a11y:
    # WHY a separate advisory job: jsx-a11y rules can surface dozens
    # of warnings the first time on a UI that grew without a11y in
    # mind; we don't want that to gate merges. continue-on-error keeps
    # it informational. Drop the flag once the codebase is clean.
    name: a11y (jsx-a11y + vitest-axe)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: install
        run: npm install --include=optional
      - name: lint:a11y (static jsx-a11y)
        run: npm run lint:a11y
      - name: test:a11y (vitest-axe runtime)
        run: npm run test:a11y

  e2e:
    # WHY a separate advisory job: Playwright + chromium adds ~250 MB
    # to the install step and another ~3 minutes to wall-clock time;
    # we don't want it on the critical path of every push. The job
    # also depends on docker compose actually booting healthy
    # containers, which is a different failure surface than the
    # unit-test jobs. continue-on-error keeps it informational
    # until the docker-compose-in-CI pattern stabilises.
    name: e2e (playwright smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: env
        # WHY .env: docker-compose.yml expects the file. Defaults are fine
        # for the e2e demo; we only need a session cookie + admin login.
        run: cp .env.example .env
      - name: vendor waf_ml into ml-service
        # WHY: docker compose --build resolves the entire compose graph
        # even when --no-deps would be enough; ml-service's Dockerfile
        # COPYs ./waf_ml/ which only exists if 'make vendor-ml' has run
        # (or this step). Doing it once up front makes any later
        # 'docker compose build' work without surprises.
        run: cp -r ml/src/waf_ml ml-service/waf_ml
      - name: bring up the minimal stack
        # WHY only postgres + backend + frontend: ml-service / clickhouse
        # / vector / dvwa add ~5 minutes of wall time and aren't on the
        # critical path of the smoke test. --no-deps stops compose from
        # also pulling in ml-service through any indirect chain.
        run: |
          # backend wants postgres + redis + clickhouse healthy; pull them
          # all into the up call so depends_on chains resolve cleanly.
          docker compose up -d --build postgres redis clickhouse
          docker compose up -d --build backend frontend
          # Wait for the SPA to respond.
          for _ in $(seq 1 60); do
            if curl -fs http://localhost:3000/ >/dev/null 2>&1; then
              echo "frontend ready"; break
            fi
            sleep 2
          done
      - name: bootstrap (migrations + admin seed)
        run: docker compose exec -T backend alembic upgrade head
      - name: install playwright
        working-directory: e2e
        run: |
          npm install
          npx playwright install --with-deps chromium
      - name: run smoke
        working-directory: e2e
        env:
          CI: "true"
          E2E_PANEL_URL: http://localhost:3000
        run: npm test
      - name: dump logs on failure
        if: failure()
        run: |
          docker compose logs backend frontend postgres
          ls -la e2e/test-results || true

  # WHY: a single aggregator the branch-protection rule can pin against;
  # adding a new job later doesn't require touching protection settings.
  ci-ok:
    name: ci-ok
    needs: [backend, ml, ml-service, bench, frontend, audit]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: aggregate
        run: |
          if [ "${{ needs.backend.result }}" != "success" ] \
             || [ "${{ needs.ml.result }}" != "success" ] \
             || [ "${{ needs.ml-service.result }}" != "success" ] \
             || [ "${{ needs.bench.result }}" != "success" ] \
             || [ "${{ needs.frontend.result }}" != "success" ]; then
            echo "one or more jobs failed"
            exit 1
          fi
