[project]
name = "waf-bench"
version = "0.1.0"
description = "Attack-bench harness for waf-panel: drives labelled corpora, measures FPR/FNR/latency"
requires-python = ">=3.11"
authors = [{ name = "Gennadii Panteleev", email = "Terraxell@gmail.com" }]
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]
ignore = ["E501", "UP017"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["bench*"]
