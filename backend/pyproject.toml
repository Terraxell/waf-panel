[project]
name = "waf-panel-backend"
version = "0.1.0"
description = "FastAPI gateway for the waf-panel project"
requires-python = ">=3.11"
authors = [{ name = "Gennadii Panteleev", email = "Terraxell@gmail.com" }]
dependencies = [
    "fastapi>=0.111",
    "pydantic[email]>=2.6",
    "pydantic-settings>=2.2",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "psycopg[binary]>=3.1",
    "httpx>=0.27",
    "python-jose[cryptography]>=3.3",
    "passlib[argon2]>=1.7",
    # numpy: drift_worker.py vectorises rows from traffic_log before
    # featurising them via waf_ml.features. Without it the worker
    # crashes at import time on a fresh container.
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]
ignore = [
    "E501",
    "UP017",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --strict-markers"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
