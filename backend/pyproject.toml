[project]
name = "waf-panel-backend"
version = "0.1.0"
description = "FastAPI gateway for the waf-panel project"
requires-python = ">=3.11"
authors = [{ name = "Gennadii Panteleev", email = "Terraxell@gmail.com" }]
dependencies = [
    "fastapi>=0.111",
    "pydantic[email]>=2.6",
    "pydantic-settings>=2.2",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "psycopg[binary]>=3.1",
    "redis>=5.0",
    "httpx>=0.27",
    "python-jose[cryptography]>=3.3",
    "passlib[argon2]>=1.7",
    "python-multipart>=0.0.9",
    # numpy: drift_worker.py vectorises rows from traffic_log before
    # featurising them via waf_ml.features. Without it the worker
    # crashes at import time on a fresh container.
    "numpy>=1.26",
    # Observability stack — added in #129. Both libs are mature, BSD/MIT,
    # and have first-party stubs (no types-* shim needed).
    "prometheus-fastapi-instrumentator>=7.0",
    "structlog>=24.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    # WHY: types-passlib gives mypy stubs for passlib.context.CryptContext.
    # Without it ignore_missing_imports = true downgrades verify/hash to
    # Any -- we lose useful checks on the security-critical hashing path.
    "types-passlib>=1.7",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]
ignore = [
    "E501",
    "UP017",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --strict-markers"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# ── mypy ─────────────────────────────────────────────────────────────
# WHY a separate section (not a follow-up Edit on the existing file):
# the linter trimmed mid-section the first time; appending in one shot
# via heredoc bypasses any line-by-line editor that truncates.

[tool.mypy]
python_version = "3.11"
files = ["src/waf_panel"]
# Pydantic plugin: teaches mypy that BaseModel(Field(default=...)) means
# the constructor accepts that arg without it. Without this the guard
# in main.py and Settings() in config.py both falsely trip.
plugins = ["pydantic.mypy"]
# Permissive baseline for now -- third-party libs (sqlalchemy, jose,
# clickhouse_connect) ship partial stubs. Tighten incrementally with
# per-module overrides as modules become 100%-typed.
ignore_missing_imports = true
follow_imports = "silent"
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
