# WHY this map block: nginx doesn't ship a default for
# $connection_upgrade. The pattern below sends "upgrade" only when
# the client asked for it, "close" otherwise.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Static SPA + /api passthrough to the FastAPI gateway.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # WHY: SPA fallback — any unknown path serves index.html so client routing
    #      handles it. Prevents 404s on /rules, /incidents etc.
    location / {
        try_files $uri /index.html;
    }

    # API requests forwarded to backend service (compose-network DNS).
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # WHY: WebSocket upgrade for /api/v1/ws/* (task #122 dashboard
        # live updates). The Connection / Upgrade headers are honoured
        # only when the client actually sends them, so REST traffic
        # is unaffected.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # Keep the connection open as long as the backend chooses to;
        # the dashboard tick is 5 s, so 2 hours is comfortable headroom.
        proxy_read_timeout 7200s;
    }
}
