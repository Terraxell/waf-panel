# Static SPA + /api passthrough to the FastAPI gateway.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # WHY: SPA fallback — any unknown path serves index.html so client routing
    #      handles it. Prevents 404s on /rules, /incidents etc.
    location / {
        try_files $uri /index.html;
    }

    # API requests forwarded to backend service (compose-network DNS).
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
